name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [universal, arm64, armv7]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install Android SDK
        continue-on-error: true
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms" || true
          SDKM=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "SDKM=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-37" "platforms;android-37.2" "build-tools;37.0.0"; do
            "$SDKM" "$pkg" > /dev/null 2>&1 && echo "installed $pkg" || echo "skip $pkg"
          done
          ls "$SDK_ROOT/platforms" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK (${{ matrix.abi }})
        run: ./gradlew :app:android:assembleRelease -PtargetAbi=${{ matrix.abi }} --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-${{ matrix.abi }}
          path: app/android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Display APK Hashes
        run: |
          cd app/android/build/outputs/apk/release
          echo "### APK Hashes (${{ matrix.abi }})" >> $GITHUB_STEP_SUMMARY
          for f in *.apk; do
            echo "- $f: $(sha256sum "$f" | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY
          done
